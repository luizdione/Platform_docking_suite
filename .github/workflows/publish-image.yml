# Publica a imagem de conteiner no GHCR.
#
# Por que por workflow, e nao `docker push` da maquina do autor:
#   - o pacote nasce LIGADO ao repositorio e herda a visibilidade dele, por causa
#     do label org.opencontainers.image.source (ver Dockerfile);
#   - nao gasta RAM nem disco da estacao de trabalho -- a imagem tem ~5,7 GB;
#   - nao precisa de escopo write:packages num token pessoal: o GITHUB_TOKEN da
#     propria Action basta, com `permissions: packages: write` abaixo.
#
# Gatilhos, de proposito conservadores: NADA e publicado a cada commit. Ou se
# clica em "Run workflow", ou se cria uma tag de versao.
name: Publish container image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag for the image (optional; the commit SHA is always applied)"
        required: false
        type: string
  push:
    tags:
      - "v*"

concurrency:
  # Duas publicacoes simultaneas disputariam o mesmo `latest`. A da frente espera.
  group: publish-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # O runner ubuntu-latest sobe com ~14 GB livres em /. A base CUDA mais as
      # wheels de openmm/rdkit passam disso com folga; sem esta limpeza o build
      # morre com "no space left on device" no meio do pip install.
      - name: Free up disk space on the runner
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          echo "After:"; df -h / | tail -1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `images` em minusculas: o GHCR recusa maiuscula no nome do repositorio.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/platform_docking_suite
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest

      # Build local primeiro, SEM push: a imagem tem de ser inspecionada antes de
      # existir no registro. Publicar e distribuir, e nao se desfaz.
      - name: Build the image (no push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: docking-suite:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Espelha a conferencia que se faz na estacao: a imagem carrega CODIGO, nao
      # dado. Se um arquivo de estrutura ou de trajetoria entrar, o job falha aqui
      # e nada e publicado.
      - name: Assert the image carries no research data
        run: |
          set -euo pipefail
          cid=$(docker create docking-suite:ci)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker export "$cid" | tar -t | grep '^app/' > /tmp/app_files.txt
          echo "Files under /app: $(wc -l < /tmp/app_files.txt)"

          echo "--- forbidden extensions"
          if grep -Ei '^app/.*\.(pdb|pdbqt|mol2|sdf|cif|dcd|xtc|trr|chk|h5|npz)$' /tmp/app_files.txt; then
            echo "FAIL: the image carries structure or trajectory data"; exit 1
          fi

          echo "--- forbidden directories"
          if grep -E '^app/(docking_data|docking_project|results|figures|reports|runs|proteins)/' /tmp/app_files.txt; then
            echo "FAIL: the image carries a data tree"; exit 1
          fi

          echo "OK: code and configuration only."

      - name: Smoke-test the image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint vina docking-suite:ci --version
          docker run --rm docking-suite:ci registry.py | tail -3

      # Reaproveita as camadas que o passo de build deixou no cache do Buildx, de
      # modo que isto e push e nao um segundo build.
      - name: Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "A package created by this workflow is linked to the repository through"
            echo "\`org.opencontainers.image.source\` and inherits its visibility. A package"
            echo "that already existed as private keeps that visibility: change it once under"
            echo "Package settings."
          } >> "$GITHUB_STEP_SUMMARY"
